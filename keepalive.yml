# Stops the free Supabase project pausing. Add repo secrets SUPABASE_URL and SUPABASE_ANON_KEY.
name: keepalive
on:
  schedule: [{ cron: '0 6 */3 * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/universities?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
