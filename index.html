<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusVoice</title>
<script>try{var t=localStorage.getItem('cv_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fbf6ef;--card:#ffffff;--ink:#2a2230;--mut:#6d6275;--line:#eadfd2;--acc:#c2410c;--accInk:#ffffff;--accSoft:#fdebdc;--warn:#a15c07;--bad:#b42318;--band:#2e2140;--bandInk:#fdf6ee;--sh:0 1px 2px rgba(70,40,20,.07),0 6px 18px rgba(70,40,20,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171219;--card:#221b27;--ink:#f4edf3;--mut:#b0a3b8;--line:#3a2f43;--acc:#f59a6c;--accInk:#2a1206;--accSoft:#35263a;--warn:#fbbf24;--bad:#f97066;--band:#100b14;--bandInk:#f4edf3;--sh:none}}
:root[data-theme=dark]{--bg:#171219;--card:#221b27;--ink:#f4edf3;--mut:#b0a3b8;--line:#3a2f43;--acc:#f59a6c;--accInk:#2a1206;--accSoft:#35263a;--warn:#fbbf24;--bad:#f97066;--band:#100b14;--bandInk:#f4edf3;--sh:none}
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 "Hanken Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-weight:700;font-family:"Fraunces",system-ui,sans-serif;line-height:1.1;margin:0 0 .5em;letter-spacing:-.01em}
.band{background:radial-gradient(900px 260px at 88% -30%,rgba(245,154,108,.30),transparent 65%),radial-gradient(500px 200px at 0% 120%,rgba(194,65,12,.22),transparent 70%),var(--band);color:var(--bandInk);border-radius:0 0 28px 28px}
a{color:var(--acc)}
.nf{text-align:center;padding:34px 22px}.nf svg{color:var(--acc);margin-bottom:6px}.nf .row{justify-content:center}.nf p{color:var(--mut);max-width:44ch;margin:0 auto 16px}
.n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accSoft);color:var(--acc);font:700 15px 'Hanken Grotesk',sans-serif;margin-right:10px;vertical-align:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}
nav b{font:800 20px "Fraunces",sans-serif;margin-right:auto}
nav a{color:inherit;text-decoration:none;opacity:.85;padding:4px 2px;border-bottom:2px solid transparent}
nav a:hover,nav a.on{opacity:1;border-color:var(--acc)}
.tg{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 14px;font:500 14px 'Hanken Grotesk',sans-serif;cursor:pointer}.tg:hover{background:rgba(255,255,255,.12)}
.uni{background:linear-gradient(90deg,transparent,transparent)}
.uni{font:700 clamp(28px,7vw,52px)/1.05 "Fraunces",sans-serif;padding:22px 0 26px}
.uni small{display:block;font:500 14px "Hanken Grotesk",sans-serif;opacity:.7;margin-bottom:6px}
main.wrap{padding:32px 18px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
label{display:block;font-weight:700;margin:14px 0 5px;font-size:15px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
textarea{min-height:130px;resize:vertical}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{font:700 16px "Hanken Grotesk",sans-serif;background:var(--acc);color:var(--accInk);border:0;border-radius:999px;padding:11px 22px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--mut);font-size:14px;margin:4px 0 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin-top:14px}
.chk input{width:auto;margin-top:5px}
.hero h1{font-size:clamp(32px,7vw,56px);max-width:15ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:26px 0}
.tag{display:inline-block;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:1px 10px;margin-right:6px}
.tag.f{color:var(--bad);border-color:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs .btn{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs .btn.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.tid{font:800 30px "Fraunces",sans-serif;letter-spacing:.04em;color:var(--acc)}
.msg{border-left:4px solid var(--acc);padding:8px 12px;background:var(--accSoft);margin:12px 0;border-radius:0 8px 8px 0}
.msg.w{border-color:var(--warn)}
pre{white-space:pre-wrap;font:14px/1.5 ui-monospace,monospace;background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0}
  .b{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;white-space:pre-wrap}.b.me{border-left:4px solid var(--acc);background:var(--accSoft)}
  .vh{position:absolute;opacity:0;width:1px;height:1px}.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--mut);cursor:pointer;font-weight:500}.drop:hover,.drop:focus-within,.drop.on{border-color:var(--acc);color:var(--acc);background:var(--accSoft)}
.fi{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;font-size:14px;word-break:break-all}
.at{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.at img{width:140px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}.at .f{padding:8px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;text-decoration:none}
.uni{display:flex;align-items:center;gap:18px}.lg{width:68px;height:68px;object-fit:contain;background:#fff;border-radius:18px;padding:7px;flex:none}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
<nav id="nav"></nav>
<div class="uni" id="uni"></div>
</div></header>
<main class="wrap" id="app"></main>

<script>
/* ---------- Setup: paste your Supabase values (Project Settings > API) ---------- */
const CFG={URL:'https://rfkfamvgqrkiwxogdikg.supabase.co',KEY:'sb_publishable_McoZy1cn4dfYuVpe3Gt6lw_v9cHbVtl',BASE:'/CampusVoice'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=t=>new Date(t).toLocaleString();
const mt=(to,s,b)=>`mailto:${to}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`;
const STATUS=['Sent to in-charge','Seen','In progress','Resolved','Closed (no action)'];
const ok=!CFG.URL.includes('YOUR-');
const sb=ok?supabase.createClient(CFG.URL,CFG.KEY):null;
let U=null,tab='complaints',trace=null,flash='',rows=[];

function getSlug(){
  const q=new URLSearchParams(location.search).get('u');if(q)return q.toUpperCase();
  let p=location.pathname;if(!p.toLowerCase().startsWith(CFG.BASE.toLowerCase()))return '';p=p.slice(CFG.BASE.length);
  const s=p.split('/').filter(x=>x&&!/\.html?$/i.test(x))[0];return s?decodeURIComponent(s).toUpperCase():'';
}
const root=()=>CFG.BASE+'/';
const link=s=>location.origin+CFG.BASE+'/'+s;
const fail=e=>`<div class="card" role="alert">Something went wrong: ${esc(e?.message||e)}</div>`;

const eff=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function updateTg(){const b=$('#tg');if(b)b.textContent=eff()==='dark'?'Light mode':'Dark mode'}
function toggleTheme(){const t=eff()==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('cv_theme',t)}catch(e){}updateTg()}
async function route(){
  if(!ok){$('#nav').innerHTML='<b>CampusVoice</b>';$('#uni').innerHTML='<div><small>Setup needed</small>CAMPUSVOICE</div>';
    $('#app').innerHTML='<div class="card"><h2>Connect Supabase</h2><p>Open index.html and paste your Supabase project URL and anon key into the CFG line at the top of the script.</p></div>';return}
  const slug=getSlug(),hp=(location.hash.replace('#/','')||'').split('/'),r=hp[0];
  U=null;
  if(slug){const {data}=await sb.from('universities').select('id,slug,name,owner_id,email_domain,logo_path').eq('slug',slug).maybeSingle();U=data;}
  $('#nav').innerHTML=`<b>CampusVoice</b>${U?`<a href="#/" data-r="">Home</a><a href="#/file" data-r="file">Report a problem</a><a href="#/track" data-r="track">Track a report</a><a href="#/admin" data-r="admin">Admin</a>`:`<a href="${root()}">Home</a><a href="#/admin" data-r="admin">University admin</a>`}`;
  $('#nav').insertAdjacentHTML('beforeend','<button class="tg" id="tg" onclick="toggleTheme()"></button>');updateTg();
  document.querySelectorAll('nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  $('#uni').innerHTML=U?`${U.logo_path?`<img class="lg" src="${esc(logoUrl(U.logo_path))}" alt="${esc(U.name)} logo">`:''}<div><small>Reporting to</small>${esc(U.name.toUpperCase())}</div>`:'<div><small>Welcome</small>CAMPUSVOICE</div>';
  if(slug&&!U){$('#app').innerHTML=`<div class="card nf"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="28" cy="28" r="16" fill="none" stroke="currentColor" stroke-width="5"/><path d="M40 40l16 16" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
  <h2>We couldn’t find that university</h2><p>There’s no university with the code “${esc(slug)}”. Check the link you were given, or type your university’s code below.</p>
  <div class="row"><input id="c" style="flex:1;min-width:180px;max-width:280px" placeholder="IITDHARWAD" aria-label="University code" onkeydown="event.key==='Enter'&&openUni()"><button class="btn" onclick="openUni()">Open</button></div>
  <p class="hint" style="margin-top:14px"><a href="${root()}">Go to the CampusVoice home page</a></p></div>`;return}
  const v={'':home,file:fileV,track:()=>trackV(hp),admin:adminV,respond:()=>respondV(hp)}[r]||home;
  await v();scrollTo(0,0);
}
window.onhashchange=route;route();

/* ---------- Public pages ---------- */
function home(){
  if(!U){$('#app').innerHTML=`<section class="hero"><h1>Campus problems, sent to the person who can fix them.</h1>
  <p style="max-width:55ch;color:var(--mut)">CampusVoice gives every university its own page where students report hostel, mess, canteen, academic and vending-machine issues. Reports go straight to the right in-charge, and students stay anonymous.</p></section>
  <div class="card"><h2>Open your university’s page</h2><label for="c">University code</label>
  <div class="row"><input id="c" style="flex:1;min-width:180px" placeholder="IITDHARWAD" onkeydown="event.key==='Enter'&&openUni()"><button class="btn" onclick="openUni()">Open</button></div>
  <p class="hint">Your university shares a link like ${esc(link('IITDHARWAD'))}</p></div>
  <div class="card"><h3>Want CampusVoice for your university?</h3><p class="hint" style="margin:0">Each university gets its own admin login and its own link. Contact the CampusVoice team to set yours up.</p></div>`;return}
  $('#app').innerHTML=`<section class="hero"><h1>Something broken on campus? Tell the person who can fix it.</h1>
  <p style="max-width:55ch;color:var(--mut)">Your report goes straight to the in-charge for that area. You stay anonymous unless the issue needs your contact, like a lost item.</p>
  <div class="row"><a class="btn" href="#/file">Report a problem</a><a class="btn g" href="#/track">Track a report</a></div>
  ${U.email_domain?`<p class="hint" style="margin-top:12px">Reporting needs a verified @${esc(U.email_domain)} e-mail, so only your own community can post.</p>`:''}</section>
  <div class="steps"><div class="card"><h3><span class="n">1</span>Pick the area</h3><p class="hint">Hostel, mess, canteen, academics, vending machines and more.</p></div>
  <div class="card"><h3><span class="n">2</span>Describe it</h3><p class="hint">No sign-in needed. You get a tracking ID right away.</p></div>
  <div class="card"><h3><span class="n">3</span>Follow it</h3><p class="hint">Use your ID to see if it was seen, in progress or resolved.</p></div></div>
  <div class="card"><h3>Anonymous, not unaccountable</h3><p class="hint" style="margin:0">In-charges never see who you are on anonymous reports. Your university e-mail is stored privately and only opened by your university’s admin if a report is flagged as abuse (threats, harassment, false accusations).</p></div>`;
}
function openUni(){const c=$('#c').value.trim().replace(/[^a-z0-9]/gi,'');if(c)location.href=CFG.BASE+'/'+c.toUpperCase()}

async function fileV(){
  const {data:fs,error}=await sb.from('fields').select('id,name').eq('university_id',U.id).order('name');
  if(error)return $('#app').innerHTML=fail(error);
  picked=[];sessEmail='';if(U.email_domain){const st=await getStu();if(!st)return authV();sessEmail=st.user.email}
  $('#app').innerHTML=`<div class="card"><h2>Report a problem</h2>
  <label for="f">Area</label><select id="f">${fs.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select>
  <label for="t">Short title</label><input id="t" maxlength="120" placeholder="Washing machine on floor 2 not working">
  <label for="d">What happened?</label><textarea id="d" placeholder="Where, since when, and how it affects you."></textarea>
  <label for="fl">Photos or files <span class="hint" style="font-weight:400">(optional)</span></label>
  <label class="drop" for="fl" ondragover="event.preventDefault();this.classList.add('on')" ondragleave="this.classList.remove('on')" ondrop="event.preventDefault();this.classList.remove('on');addFiles(event.dataTransfer.files)">+ Add photos or files<br><span class="hint">Drop them here or click. Up to 5 files, 10 MB each.</span></label>
  <input class="vh" id="fl" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt,video/mp4,video/webm" onchange="addFiles(this.files);this.value=''">
  <div id="fls"></div>
  <p class="hint">Photos are cleaned of location and camera details automatically. Documents can carry your name in their properties, so check them first if you want to stay anonymous.</p>
  ${sessEmail?`<div class="msg">Signed in as <b>${esc(sessEmail)}</b> · <a href="#/file" onclick="authOut();return false">Sign out</a></div><p class="hint">Your e-mail only confirms you belong here. In-charges never see it, and your receipt is sent to it.</p>`:`<label for="e">Your university e-mail</label><input id="e" type="email" autocomplete="email">
  <p class="hint">Kept private. Only opened by the admin if this report is flagged as abuse. Your receipt is sent here.</p>`}
  <label class="chk" for="s"><input type="checkbox" id="s"><span id="sl"></span></label>
  <div id="nm" hidden><label for="n">Your name</label><input id="n" autocomplete="name"></div>
  <p class="hint" id="er" style="color:var(--bad)" role="alert"></p>
  <button class="btn" id="go" onclick="submitC()">Send report</button></div>`;
  $('#f').onchange=lf;$('#s').onchange=lf;lf();renderFiles();
}
function lf(){const lost=/lost/i.test($('#f').selectedOptions[0].text),s=$('#s');
  if(lost)s.checked=true;s.disabled=lost;
  $('#sl').textContent=lost?'Lost and found reports always include your contact so the finder can reach you':'Share my name and e-mail with the in-charge so they can contact me';
  $('#nm').hidden=!s.checked}

async function submitC(){
  const v=id=>$('#'+id).value.trim(),err=m=>{$('#er').textContent=m},sh=$('#s').checked,em=sessEmail||v('e');
  if(v('t').length<5)return err('Add a short title (at least 5 characters).');
  if(v('d').length<20)return err('Add a few more details (at least 20 characters) so the in-charge can act.');
  if(!/^\S+@\S+\.\S+$/.test(em))return err('Enter a valid university e-mail. It stays private.');
  if(sh&&!v('n'))return err('Add your name, since you chose to share contact details.');
  $('#go').disabled=true;err('');
  const files=[],fid=crypto.randomUUID();
  try{for(const [i,f] of picked.entries()){
    $('#go').textContent=`Uploading ${i+1} of ${picked.length}…`;
    const b=await prep(f),path=`pending/${fid}/${i}.${b.ext}`;
    const {error:ue}=await sb.storage.from('attachments').upload(path,b.blob,{contentType:b.mime,upsert:false});
    if(ue)throw new Error(ue.message);
    files.push({path,name:b.name,mime:b.mime,size:b.blob.size});
  }}catch(e){$('#go').disabled=false;$('#go').textContent='Send report';return err('Could not upload your files: '+e.message)}
  const {data:res,error}=await sb.rpc('submit_complaint',{p_slug:U.slug,p_field:v('f'),p_title:v('t'),p_body:v('d'),p_shared:sh,p_name:v('n'),p_email:em,p_files:files});
  if(error){$('#go').disabled=false;$('#go').textContent='Send report';return err('Could not send: '+error.message)}
  picked=[];const [code,tok]=String(res).split('/');
  sb.functions.invoke('send-complaint',{body:{code}}).catch(()=>{});
  $('#app').innerHTML=`<div class="card"><h2>Your report was sent to the ${esc($('#f')?.selectedOptions[0]?.text||'')} in-charge</h2>
  <p>Your tracking ID:</p><div class="tid">${esc(code)}</div>
  <p class="hint">Save this ID. You can check progress with it any time${sh?'':', and nobody can see who you are'}.</p>
  <label for="pl">Your private reply link</label><input readonly id="pl" value="${esc(link(U.slug)+'#/track/'+code+'/'+tok)}" onfocus="this.select()">
  <p class="hint">Use it to read the in-charge’s reply and answer back. Keep it private. It was also sent to your e-mail.</p>
  <div class="row"><button class="btn sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(code)}');this.textContent='Copied'">Copy ID</button>
  <button class="btn sm g" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#pl').value);this.textContent='Copied'">Copy private link</button><a class="btn sm g" href="#/track">Track a report</a><a class="btn sm g" href="#/file" onclick="setTimeout(route,0)">Report another</a></div></div>`;
}

function trackV(p=[]){
  if(p[1]&&p[2])return threadV(p[1],p[2]);
  $('#app').innerHTML=`<div class="card"><h2>Track a report</h2><label for="i">Tracking ID</label>
  <div class="row"><input id="i" style="flex:1;min-width:180px" placeholder="CV-A1B2C3" onkeydown="event.key==='Enter'&&lookup()"><button class="btn" onclick="lookup()">Check status</button></div></div><div id="res"></div>`;
}
async function lookup(){
  const {data,error}=await sb.rpc('track_complaint',{p_code:$('#i').value});
  if(error)return $('#res').innerHTML=fail(error);
  const c=data?.[0];
  $('#res').innerHTML=c?`<div class="card"><span class="tag">${esc(c.university)}</span><span class="tag">${esc(c.field_name)}</span><h3 style="margin-top:10px">${esc(c.title)}</h3>
  <p><b>Status: ${esc(c.status)}</b><br><span class="hint">Sent ${when(c.created_at)}</span></p>
  ${c.note?`<div class="msg"><b>Note from in-charge</b><br>${esc(c.note)}</div>`:''}</div>`
  :'<div class="card" role="alert">No report found with that ID. Check the ID from your receipt and try again.</div>';
}


/* ---------- University logo ---------- */
const logoUrl=p=>CFG.URL+'/storage/v1/object/public/logos/'+p;
async function upLogo(f){
  const m=$('#lgm');if(!f)return;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)){m.textContent='Please choose a PNG, JPG or WebP image.';return}
  if(f.size>8*1048576){m.textContent='That image is too large (max 8 MB).';return}
  m.textContent='Uploading…';
  try{
    const bm=await createImageBitmap(f),k=Math.min(1,400/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/png')),path=`${U.id}/logo-${Date.now()}.png`;
    const {error}=await sb.storage.from('logos').upload(path,blob,{contentType:'image/png'});if(error)throw error;
    const old=U.logo_path,{error:e2}=await sb.from('universities').update({logo_path:path}).eq('id',U.id);if(e2)throw e2;
    if(old)sb.storage.from('logos').remove([old]);
    U.logo_path=path;route();
  }catch(e){m.textContent='Could not save the logo: '+(e.message||e)}
}
async function rmLogo(){
  const old=U.logo_path,{error}=await sb.from('universities').update({logo_path:null}).eq('id',U.id);
  if(error)return alert(error.message);
  if(old)sb.storage.from('logos').remove([old]);U.logo_path=null;route();
}

/* ---------- Attachments ---------- */
const MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',pdf:'application/pdf',txt:'text/plain',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',mp4:'video/mp4',webm:'video/webm'};
let picked=[];
const fileUrl=p=>CFG.URL+'/storage/v1/object/public/attachments/'+p;
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function attList(a){
  if(!a||!a.length)return '';
  return '<div class="at">'+a.map(x=>/^image\//.test(x.mime)?`<a href="${esc(fileUrl(x.path))}" target="_blank" rel="noopener"><img src="${esc(fileUrl(x.path))}" alt="${esc(x.name)}" loading="lazy"></a>`
    :`<a class="f" href="${esc(fileUrl(x.path))}" target="_blank" rel="noopener">${esc(x.name)} (${kb(x.size||0)})</a>`).join('')+'</div>';
}
function addFiles(list){
  const msg=[];
  for(const f of list){
    const ext=f.name.split('.').pop().toLowerCase(),img=['jpg','jpeg','png','webp'].includes(ext);
    if(picked.length>=5){msg.push('You can attach up to 5 files.');break}
    if(!MIME[ext]){msg.push(`“${f.name}” isn’t a supported type.`);continue}
    if(f.size>(img?15:10)*1048576){msg.push(`“${f.name}” is too big (max ${img?15:10} MB).`);continue}
    picked.push(f);
  }
  renderFiles(msg.join(' '));
}
function rmFile(i){picked.splice(i,1);renderFiles()}
function renderFiles(msg=''){
  const b=$('#fls');if(!b)return;
  b.innerHTML=picked.map((f,i)=>`<div class="fi"><span>${esc(f.name)} (${kb(f.size)})</span><button class="btn sm g" onclick="rmFile(${i})" aria-label="Remove ${esc(f.name)}">Remove</button></div>`).join('')+(msg?`<p class="hint" style="color:var(--bad)" role="alert">${esc(msg)}</p>`:'');
}
async function prep(f){ // photos are re-drawn, which removes location and camera details
  const ext=f.name.split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','webp'].includes(ext)){
    const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    if(!blob)throw new Error('Could not read this image');
    return{blob,mime:'image/jpeg',ext:'jpg',name:f.name.replace(/\.[^.]+$/,'')+'.jpg'};
  }
  return{blob:f,mime:MIME[ext],ext,name:f.name};
}

/* ---------- Student sign-in (only when the university requires an e-mail domain) ---------- */
let sessEmail='',au={mode:'login',email:'',reset:false,msg:''};
const emailOk=e=>{e=(e||'').toLowerCase();const d=U?.email_domain;return !!d&&(e.endsWith('@'+d)||e.endsWith('.'+d))};
async function getStu(){const {data:{session}}=await sb.auth.getSession();return session&&emailOk(session.user.email)?session:null}
async function authOut(){await sb.auth.signOut();au={mode:'login',email:'',reset:false,msg:''};fileV()}
const aset=(m,msg)=>{au.mode=m;au.msg=msg||'';au.email=($('#ae')?.value||au.email).trim();authV()};
function authStart(reset){au.reset=reset;aset('email')}
function authV(){
  const d=esc(U.email_domain),err=`<p class="hint" id="am" style="color:var(--bad)" role="alert">${esc(au.msg)}</p>`;
  const head=t=>`<h2>${t}</h2><p class="hint" style="margin-top:0">Use your <b>@${d}</b> e-mail. It only confirms you belong to ${esc(U.name)}. In-charges never see it.</p>`;
  const em=`<label for="ae">University e-mail</label><input id="ae" type="email" placeholder="name@${d}" value="${esc(au.email)}" autocomplete="username">`;
  const m=au.mode;
  $('#app').innerHTML='<div class="card">'+(
   m==='login'?`${head('Sign in to report')}${em}<label for="apw">Password</label><input id="apw" type="password" autocomplete="current-password" onkeydown="event.key==='Enter'&&authLogin()">${err}
     <div class="row"><button class="btn" onclick="authLogin()">Sign in</button></div>
     <p class="hint">First time here? <a href="#/file" onclick="authStart(false);return false">Verify your e-mail</a> · <a href="#/file" onclick="authStart(true);return false">Forgot password?</a></p>`
  :m==='email'?`${head(au.reset?'Reset your password':'Verify your e-mail')}${em}${err}
     <div class="row"><button class="btn" onclick="authSend()">Send me a code</button><button class="btn g" onclick="aset('login')">Back</button></div>
     <p class="hint">We’ll e-mail a 6-digit code. ${au.reset?'Enter it, then choose a new password.':'Enter it, then choose a password for next time.'}</p>`
  :m==='verify'?`<h2>Enter the code</h2><p class="hint" style="margin-top:0">We sent a code to <b>${esc(au.email)}</b>. Check your spam folder if it doesn’t show up within a minute.</p>
     <label for="ac">Code</label><input id="ac" inputmode="numeric" autocomplete="one-time-code" maxlength="10" onkeydown="event.key==='Enter'&&authVerify()">${err}
     <div class="row"><button class="btn" onclick="authVerify()">Verify</button><button class="btn g" onclick="authSend()">Send a new code</button><button class="btn g" onclick="aset('login')">Back</button></div>`
  :`<h2>${au.reset?'Choose a new password':'Set your password'}</h2><p class="hint" style="margin-top:0">Your e-mail is verified. Next time you can sign in directly with this password.</p>
     <label for="p1">Password (8+ characters)</label><input id="p1" type="password" autocomplete="new-password">
     <label for="p2">Repeat password</label><input id="p2" type="password" autocomplete="new-password" onkeydown="event.key==='Enter'&&authSetPw()">${err}
     <div class="row"><button class="btn" onclick="authSetPw()">Save password</button></div>`)+'</div>';
}
function chk(e){if(!emailOk(e)){au.msg=`Please use your @${U.email_domain} e-mail.`;authV();return false}return true}
async function authLogin(){
  const e=$('#ae').value.trim().toLowerCase();au.email=e;if(!chk(e))return;
  const {error}=await sb.auth.signInWithPassword({email:e,password:$('#apw').value});
  if(error){au.msg='E-mail or password is wrong. First time here? Use “Verify your e-mail” below.';return authV()}
  fileV();
}
async function authSend(){
  const e=($('#ae')?.value||au.email).trim().toLowerCase();au.email=e;if(!chk(e))return;
  const {error}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:true}});
  if(error){au.msg='Could not send the code: '+error.message;return authV()}
  au.mode='verify';au.msg='';authV();
}
async function authVerify(){
  const {error}=await sb.auth.verifyOtp({email:au.email,token:$('#ac').value.trim(),type:'email'});
  if(error){au.msg='That code didn’t work. Check it, or send a new one.';return authV()}
  au.mode='setpw';au.msg='';authV();
}
async function authSetPw(){
  const a=$('#p1').value,b=$('#p2').value;
  if(a.length<8){au.msg='Use at least 8 characters.';return authV()}
  if(a!==b){au.msg='The two passwords don’t match.';return authV()}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){au.msg=error.message;return authV()}
  au={mode:'login',email:'',reset:false,msg:''};fileV();
}
async function saveDomain(v){
  v=v.trim().toLowerCase().replace(/^@/,'')||null;
  const {error}=await sb.from('universities').update({email_domain:v}).eq('id',U.id);
  if(error)return alert('Please enter a domain like iitdh.ac.in');
  U.email_domain=v;
}

/* ---------- Conversation: student and in-charge, each through a private link ---------- */
function thread(c,me){
  const L=[{sender:'student',body:c.body,at:c.created_at,att:c.attachments}].concat(c.messages||[]);
  return L.map(m=>`<div class="b ${m.sender===me?'me':''}"><div class="hint">${m.sender===me?'You':m.sender==='student'?'Student':'In-charge'} · ${when(m.at)}</div>${esc(m.body)}${m.att?attList(m.att):''}</div>`).join('');
}
async function threadV(code,tok){
  const {data:c,error}=await sb.rpc('student_view',{p_code:code,p_token:tok});
  if(error||!c)return $('#app').innerHTML='<div class="card" role="alert"><h2>This link isn’t valid</h2><p>Use the private link from your receipt e-mail, or look up your tracking ID on the Track page.</p></div>';
  $('#app').innerHTML=`<div class="card"><span class="tag">${esc(c.university)}</span><span class="tag">${esc(c.field_name)}</span><b>${esc(code)}</b>
  <h3 style="margin-top:10px">${esc(c.title)}</h3><p><b>Status: ${esc(c.status)}</b></p>${thread(c,'student')}
  <label for="sm">Reply to the in-charge</label><textarea id="sm" maxlength="1000" style="min-height:90px"></textarea>
  <p class="hint" id="sr" role="alert"></p><button class="btn" onclick="sendStu('${esc(code)}','${esc(tok)}')">Send reply</button>
  <p class="hint">Your reply stays anonymous unless you chose to share your contact details.</p></div>`;
}
async function sendStu(code,tok){
  const {data,error}=await sb.rpc('student_reply',{p_code:code,p_token:tok,p_body:$('#sm').value});
  if(error||!data)return $('#sr').textContent='Could not send. Write at least a couple of words (up to 20 replies per report).';
  sb.functions.invoke('send-complaint',{body:{code,stoken:tok}}).catch(()=>{});
  threadV(code,tok);
}
async function respondV(p){
  const {data:c,error}=await sb.rpc('get_respond',{p_code:p[1]||'',p_token:p[2]||''});
  if(error||!c)return $('#app').innerHTML='<div class="card" role="alert"><h2>This link isn’t valid</h2><p>Open the full link from the e-mail you received.</p></div>';
  $('#app').innerHTML=`<div class="card"><span class="tag">${esc(c.field_name)}</span><b>${esc(p[1])}</b>
  <h2 style="margin-top:10px">${esc(c.title)}</h2>${thread(c,'incharge')}
  <label for="rs">Status</label><select id="rs">${STATUS.slice(1).map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select>
  <label for="rn">Reply to the student (optional)</label><textarea id="rn" maxlength="1000" style="min-height:90px"></textarea>
  <p class="hint" id="rm" role="alert"></p><button class="btn" onclick="sendResp('${esc(p[1])}','${esc(p[2])}')">Send</button>
  <p class="hint">The student is e-mailed your reply. You never see their address.</p></div>`;
}
async function sendResp(code,tok){
  const {data,error}=await sb.rpc('respond_complaint',{p_code:code,p_token:tok,p_status:$('#rs').value,p_note:$('#rn').value});
  if(error||!data)return $('#rm').textContent='Could not save. Please try again.';
  sb.functions.invoke('send-complaint',{body:{code,token:tok}}).catch(()=>{});
  await respondV(['respond',code,tok]);$('#rm').textContent='Saved. The student has been e-mailed.';
}

/* ---------- Admin ---------- */
async function adminV(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    if(!U){const {data}=await sb.from('universities').select('slug').eq('owner_id',session.user.id).maybeSingle();
      if(data){location.href=CFG.BASE+'/'+data.slug+'#/admin';return}}
    else if(U.owner_id===session.user.id)return dash();
  }
  $('#app').innerHTML=`<div class="card"><h2>University admin sign in</h2>
  <label for="ai">Admin ID</label><input id="ai" placeholder="iitdharwad@campusvoice.com" autocomplete="username">
  <label for="ap">Password</label><input id="ap" type="password" autocomplete="current-password" onkeydown="event.key==='Enter'&&login()">
  <p class="hint" id="ae" style="color:var(--bad)" role="alert">${session?'This account isn’t the admin of this university.':''}</p><button class="btn" onclick="login()">Sign in</button></div>`;
}
async function login(){
  const {error}=await sb.auth.signInWithPassword({email:$('#ai').value.trim().toLowerCase(),password:$('#ap').value});
  if(error)return $('#ae').textContent='Admin ID or password is wrong.';
  location.hash='#/admin';route();
}
async function logout(){await sb.auth.signOut();location.href=root()}
function go(t){tab=t;trace=null;dash()}

async function dash(){
  const T=[['complaints','Complaints'],['fields','In-charges'],['settings','Settings']];
  $('#app').innerHTML=`<div class="card"><b>Your students’ link</b><div class="row"><input readonly id="lk" value="${esc(link(U.slug))}" style="flex:1;min-width:200px" onfocus="this.select()">
  <button class="btn sm" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#lk').value);this.textContent='Copied'">Copy</button><button class="btn sm g" onclick="logout()">Sign out</button></div></div>
  ${flash?`<div class="msg">${esc(flash)}</div>`:''}<div class="tabs">${T.map(([k,l])=>`<button class="btn sm ${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div><div id="tb">Loading…</div>`;flash='';
  await({complaints:tComp,fields:tFields,settings:tSet}[tab])();
}
async function tComp(){
  const {data,error}=await sb.from('complaints').select('*').eq('university_id',U.id).order('created_at',{ascending:false});
  if(error)return $('#tb').innerHTML=fail(error);
  rows=data;
  const {data:at}=await sb.from('attachments').select('*').eq('university_id',U.id),by={};(at||[]).forEach(a=>(by[a.complaint_id]=by[a.complaint_id]||[]).push(a));
  $('#tb').innerHTML=(data.length?`<button class="btn sm g" style="margin-bottom:12px" onclick="csv()">Download CSV backup</button>`:'')+(data.map(c=>`<div class="card"><div class="row" style="justify-content:space-between"><div><span class="tag">${esc(c.field_name)}</span>${c.flag?'<span class="tag f">Flagged as abuse</span>':''}<b>${esc(c.code)}</b></div><span class="hint">${when(c.created_at)}</span></div>
  <h3 style="margin-top:10px">${esc(c.title)}</h3><p>${esc(c.body)}</p>
  ${attList(by[c.id])}
  <p class="hint">${c.shared?'Shared by '+esc(c.name):'Anonymous to in-charges'}</p>
  <div class="row"><select aria-label="Status" style="width:auto" onchange="upd('${c.id}',{status:this.value})">${STATUS.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select>
  <input aria-label="Note to the student" style="flex:1;min-width:160px" placeholder="Note to the student" value="${esc(c.note)}" onchange="upd('${c.id}',{note:this.value})">
  ${c.flag?`<button class="btn sm" onclick="doTrace('${c.id}')">Trace sender</button>`:`<button class="btn sm g" onclick="flag('${c.id}')">Flag as abuse</button>`}</div>
  <div id="tr${c.id}"></div></div>`).join('')||'<div class="card">No reports yet. Share your link with students to get started.</div>');
  if(trace)doTrace(trace);
}
async function upd(id,o){const {error}=await sb.from('complaints').update(o).eq('id',id);if(error)alert('Could not save: '+error.message)}
async function flag(id){if(confirm('Flag this report as abuse of anonymity? You can then trace the sender and report them.')){await upd(id,{flag:true});tComp()}}
async function doTrace(id){
  trace=id;const c=rows.find(x=>x.id===id);if(!c)return;
  const {data,error}=await sb.from('complaint_private').select('email').eq('complaint_id',id).single();
  const {data:up}=await sb.from('university_private').select('authority_email').eq('university_id',U.id).maybeSingle();
  if(error)return;const to=up?.authority_email,
  body=`Abuse of the anonymous reporting system at ${U.name}.\n\nReport ID: ${c.code}\nDate: ${when(c.created_at)}\nReporter e-mail: ${data.email}\n\nContent:\n${c.title}\n${c.body}`;
  $('#tr'+id).innerHTML=`<div class="msg w"><b>Sender: ${esc(data.email)}</b><pre>${esc(body)}</pre>${to?`<a class="btn sm" href="${mt(to,'Abuse report '+c.code+' ('+U.name+')',body)}">E-mail this to ${esc(to)}</a>`:'<span class="hint">Add the authority’s e-mail under Settings to send this report.</span>'}</div>`;
}
function csv(){
  const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"',h=['code','created_at','field_name','title','body','status','note','shared','name','flag'];
  const t=[h.join(',')].concat(rows.map(r=>h.map(k=>q(r[k])).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=U.slug+'-complaints.csv';a.click();
}
async function tFields(){
  const [{data:fs,error},{data:cs}]=await Promise.all([sb.from('fields').select('id,name').eq('university_id',U.id).order('name'),sb.from('field_contacts').select('field_id,email').eq('university_id',U.id)]);
  if(error)return $('#tb').innerHTML=fail(error);
  const em=Object.fromEntries((cs||[]).map(c=>[c.field_id,c.email]));
  $('#tb').innerHTML=`<div class="card"><h3>Area in-charges</h3><p class="hint">Reports for each area are e-mailed to the address below. Update these at the start of each year.</p>
  ${fs.map(f=>`<div class="row" style="margin-bottom:8px"><input style="flex:1;min-width:130px" value="${esc(f.name)}" aria-label="Area name" onchange="svName('${f.id}',this.value)">
  <input style="flex:2;min-width:200px" type="email" placeholder="incharge@university.edu" aria-label="In-charge e-mail" value="${esc(em[f.id])}" onchange="svMail('${f.id}',this.value)">
  <button class="btn sm g" aria-label="Remove ${esc(f.name)}" onclick="rmF('${f.id}')">Remove</button></div>`).join('')}
  <button class="btn sm g" onclick="addF()">Add an area</button></div>`;
}
async function svName(id,v){const {error}=await sb.from('fields').update({name:v.trim()}).eq('id',id);if(error)alert(error.message)}
async function svMail(id,v){const {error}=await sb.from('field_contacts').upsert({field_id:id,university_id:U.id,email:v.trim()});if(error)alert(error.message)}
async function addF(){await sb.from('fields').insert({university_id:U.id,name:'New area'});tFields()}
async function rmF(id){if(confirm('Remove this area? Past reports stay in your list.')){await sb.from('fields').delete().eq('id',id);tFields()}}
async function tSet(){
  const {data:up}=await sb.from('university_private').select('authority_email').eq('university_id',U.id).maybeSingle();
  $('#tb').innerHTML=`<div class="card"><h3>Authority for abuse reports</h3><p class="hint">Where traced abuse reports are sent (for example the Dean of Students).</p>
  <label for="au">Authority e-mail</label><input id="au" type="email" value="${esc(up?.authority_email)}" onchange="sb.from('university_private').upsert({university_id:U.id,authority_email:this.value.trim()}).then(r=>r.error&&alert(r.error.message))"></div>
  <div class="card"><h3>University logo</h3><p class="hint">Shown beside your university’s name at the top of your page. PNG, JPG or WebP; a square image works best.</p>
  ${U.logo_path?`<img class="lg" src="${esc(logoUrl(U.logo_path))}" alt="Current logo" style="margin:12px 0">`:''}
  <div class="row" style="margin-top:12px"><label class="btn sm" for="lgf" style="margin:0;cursor:pointer">${U.logo_path?'Replace logo':'Upload logo'}</label>
  <input class="vh" id="lgf" type="file" accept="image/png,image/jpeg,image/webp" onchange="upLogo(this.files[0])">${U.logo_path?'<button class="btn sm g" onclick="rmLogo()">Remove</button>':''}</div>
  <p class="hint" id="lgm" role="alert"></p></div>
  <div class="card"><h3>Student sign-in</h3><p class="hint">Make students verify a university e-mail before reporting. Leave empty to let anyone report without signing in.</p>
  <label for="dm">E-mail must end with</label><div class="row" style="flex-wrap:nowrap"><span>@</span><input id="dm" placeholder="iitdh.ac.in" value="${esc(U.email_domain)}" onchange="saveDomain(this.value)"></div></div>
  <div class="card"><h3>University name</h3><label for="un">Shown at the top of every page and e-mail</label><input id="un" value="${esc(U.name)}" onchange="sb.from('universities').update({name:this.value.trim()||U.name}).eq('id',U.id).then(()=>route())"></div>`;
}
